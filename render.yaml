services:
  - type: web
    name: linguistic-app
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python init_db.py && python seed.py
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
